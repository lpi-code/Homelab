apiVersion: v1
kind: Service
metadata:
  name: actual
  namespace: actual
  annotations:
    # MetalLB pool cluster-lan is 10.30.0.200-220; .200/.201/.202 are taken.
    metallb.universe.tf/loadBalancerIPs: 10.30.0.203
spec:
  type: LoadBalancer
  selector:
    app: actual
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
