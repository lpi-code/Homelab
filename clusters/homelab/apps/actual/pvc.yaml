apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actual-data
  namespace: actual
spec:
  accessModes:
    - ReadWriteOnce
  # Provided by the nfs-subdir-external-provisioner HelmRelease in
  # clusters/homelab/infrastructure/nfs-provisioner.
  # This PVC stays Pending until the OpenMediaVault NFS export is live.
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
