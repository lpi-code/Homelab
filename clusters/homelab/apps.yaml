apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  # Storage must exist before Actual's PVC can bind.
  dependsOn:
    - name: infrastructure
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  path: ./clusters/homelab/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
